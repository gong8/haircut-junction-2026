{ // eyebrows: short fixed strands along the brow ridge
  const brows = new THREE.InstancedMesh(strandGeo, hairMat, 2 * 140);
  let i = 0;
  for (const s of [-1, 1]) for (let j = 0; j < 140; j++, i++) {
    const t = Math.random(), root = on(s * (0.19 + 0.3 * t), 0.235 + 0.035 * Math.sin(Math.PI * t) - 0.035 * t + rnd(0.012), 0.92, 0.998);
    dir.set(s, 0.25 + rnd(0.3), -0.25).normalize();
    brows.setMatrixAt(i, m.compose(root, q.setFromUnitVectors(UP, dir), sc.set(1.3, 0.05 + Math.random() * 0.03, 1.3)));
    brows.setColorAt(i, col.copy(BROWN).multiplyScalar(0.5 + Math.random() * 0.5));
  }
  scene.add(brows);
}

function pointAt(s, arc, out) { // the point `arc` along the strand, from the root
  const seg = s.L / SEG, i = Math.min(Math.floor(arc / seg), SEG - 1);
  return out.copy(s.p[i]).lerp(s.p[i + 1], arc / seg - i);
}
function setLength(s, L, falls, F) {
  if (L === s.L) return;
  if (L < s.L && L >= 0.004) {             // cut: the stub keeps the shape it had
    if (falls) spawnClip(s, L, F);
    const kept = s.p.map((_, i) => pointAt(s, i * L / SEG, V()));
    kept.forEach((pt, i) => { s.p[i].copy(pt); s.o[i].copy(pt); });
  } else {                                 // new, regrown (scrubbing back) or shaved off
    if (falls && L < s.L) spawnClip(s, L, F);
    s.p.forEach((pt, i) => { pt.copy(s.root).addScaledVector(s.n, i * L / SEG); s.o[i].copy(pt); });
    if (L < 0.004) for (let j = 0; j < SEG; j++) hair.setMatrixAt(s.i * SEG + j, ZERO);
  }
  s.L = L;
  s.still = 0;
  hair.instanceMatrix.needsUpdate = true;
}
const TICK = 1 / 60;
function simulateHair(draw = true) { // one fixed tick
  const bp = tip, fall = 9 * TICK * TICK;
  for (const s of strands) {
    const L = s.L;
    if (L < 0.004) continue;
    if (s.still > 40) {                    // asleep until the blade comes near
      if (s.root.distanceToSquared(bp) > (L + 0.35) ** 2) continue;
      s.still = 0;
    }
    const seg = L / SEG;
    let moved = 0;
    for (let i = 1; i <= SEG; i++) {
      const p = s.p[i], o = s.o[i], arc = i * seg;
      tmp.copy(p).sub(o).multiplyScalar(0.9);          // carry on moving, with drag
      o.copy(p);
      p.add(tmp);
      p.y -= fall;                                     // gravity
      // stiffness: near the root a hair stands where it grows, further out it is free to droop
      a.copy(s.root).addScaledVector(s.n, arc).addScaledVector(s.lay, 1.2 * arc * arc);
      p.lerp(a, 0.0012 / (arc * arc * arc + 0.0012));
      const d = a.copy(p).sub(bp).length();            // the blade shoves hair aside
      if (d < 0.13 && d > 1e-6) p.addScaledVector(a, (0.13 - d) / d * 0.5);
      p.copy(a.copy(p).sub(s.p[i - 1]).setLength(seg).add(s.p[i - 1])); // a hair does not stretch
      const r = p.length(), skin = skinAt(dir.copy(p).divideScalar(r)) + 0.018;
      if (r < skin) p.copy(dir).multiplyScalar(skin);  // it lies on the scalp, not in it
      if (p.y < -0.75) {                               // and on the neck
        const nx = p.x, nz = p.z + 0.08, nr = Math.hypot(nx, nz);
        if (nr < 0.47) { p.x = nx / nr * 0.47; p.z = nz / nr * 0.47 - 0.08; }
      }
      moved = Math.max(moved, p.distanceToSquared(o));
    }
    s.still = moved < 1e-8 ? s.still + 1 : 0;
    if (!draw) continue;
    for (let j = 0; j < SEG; j++) {
      const w = 1 - 0.5 * j / SEG;                     // taper to the tip
      dir.copy(s.p[j + 1]).sub(s.p[j]).normalize();
      hair.setMatrixAt(s.i * SEG + j, m.compose(s.p[j], q.setFromUnitVectors(UP, dir), sc.set(w, seg, w)));
    }
  }
  if (draw) hair.instanceMatrix.needsUpdate = true;
}

// ---------- clippings: what the blade cuts off keeps its curl, falls, tumbles and settles ----------
const MAXC = 5000, clipData = [];
const clips = new THREE.InstancedMesh(strandGeo, hairMat, MAXC * CSEG);
clips.count = 0;
clips.castShadow = true;
clips.frustumCulled = false;
scene.add(clips);
let clipNext = 0;
function spawnClip(s, newL, F) {
  const cut = s.L - newL;
  if (cut < 0.015) return;
  const i = clipNext++ % MAXC;
  const c = clipData[i] ??= { p: V(), v: V(), w: V(), q: new THREE.Quaternion(), shape: Array.from({ length: CSEG }, () => new THREE.Matrix4()) };
  const pts = Array.from({ length: CSEG + 1 }, (_, j) => pointAt(s, newL + cut * j / CSEG, V()));
  c.p.copy(pts[0]).add(pts[CSEG]).multiplyScalar(0.5);
  c.q.setFromUnitVectors(UP, dir.copy(pts[CSEG]).sub(pts[0]).normalize());
  const inv = c.q.clone().invert();
  pts.forEach(pt => pt.sub(c.p).applyQuaternion(inv));  // the cut piece, in its own frame
  for (let j = 0; j < CSEG; j++) {
    dir.copy(pts[j + 1]).sub(pts[j]);
    c.shape[j].compose(pts[j], q.setFromUnitVectors(UP, a.copy(dir).normalize()), sc.set(0.8, dir.length(), 0.8));
    clips.setColorAt(i * CSEG + j, col.copy(BROWN).multiplyScalar(s.shade)); // clippings keep the hair's own colour
  }
  c.v.copy(s.n).multiplyScalar(0.2 + Math.random() * 0.6).addScaledVector(tipVel, 0.3).add(tmp.set(rnd(0.5), rnd(0.3), rnd(0.5)));
  c.w.set(rnd(5), rnd(5), rnd(5));
  c.live = true;
  clips.instanceColor.needsUpdate = true;
  clips.count = Math.min(clipNext, MAXC) * CSEG;
}
function settle(c, n) { // lie flat on whatever it landed on
  a.set(0, 1, 0).applyQuaternion(c.q);
  tangent(a, n);
  if (a.lengthSq() < 1e-6) tangent(a.set(1, 0, 0), n);
  c.q.setFromUnitVectors(UP, a.normalize());
  c.live = false;
}
function simulateClips(dt) {
  let moved = false;
  for (let i = 0; i < clips.count / CSEG; i++) {
    const c = clipData[i];
    if (!c.live) continue;
    moved = true;
    c.v.y -= 9 * dt;                                   // gravity, then air drag and flutter: hair is light
    c.v.multiplyScalar(Math.exp(-2.2 * dt));
    c.v.x += rnd(2.5) * dt;
    c.v.z += rnd(2.5) * dt;
    c.p.addScaledVector(c.v, dt);
    const spin = c.w.length() * dt;
    if (spin > 1e-5) c.q.premultiply(q.setFromAxisAngle(tmp.copy(c.w).normalize(), spin));
    const r = c.p.length(), skin = skinAt(dir.copy(c.p).divideScalar(r || 1)) + 0.03;
    if (r < skin) {                                    // slide off the head
      c.p.copy(dir).multiplyScalar(skin);
      const vn = c.v.dot(dir);
      if (vn < 0) c.v.addScaledVector(dir, -vn);
      c.v.multiplyScalar(0.97);
    }
    const e = tmp.copy(c.p).sub(CAPE_C).divide(CAPE_R).length();
    if (e < 1) {                                       // land on the cape, or slide down its sides
      nrm.copy(tmp).divide(CAPE_R).normalize();
      c.p.copy(tmp).divideScalar(e).multiply(CAPE_R).add(CAPE_C).addScaledVector(nrm, 0.008);
      const vn = c.v.dot(nrm);
      if (vn < 0) c.v.addScaledVector(nrm, -vn);
      c.v.multiplyScalar(0.9);
      c.w.multiplyScalar(0.8);
      if (nrm.y > 0.8) settle(c, nrm);
    }
    if (c.p.y < FLOOR + 0.012) { c.p.y = FLOOR + 0.012; settle(c, UP); }
    for (let j = 0; j < CSEG; j++) clips.setMatrixAt(i * CSEG + j, m.compose(c.p, c.q, ONE).multiply(c.shape[j]));
  }
  if (moved) clips.instanceMatrix.needsUpdate = true;
}

// ---------- robot arm: drawn through the joint positions the environment reports ----------
const paint_ = std(0xe8762c, 0.35, 0.1), joint = std(0x23262c, 0.4, 0.6), steel = std(0xdfe5ec, 0.22, 1);
const armNow = R.frames[0].arm.map(p => V(...p)), armGoal = armNow.map(p => p.clone());
const tip = armNow[3], tipVel = V(), tipWas = V();
const shoulder = armNow[0];
part(new THREE.CylinderGeometry(0.2, 0.26, shoulder.y - FLOOR, 32), joint, V(shoulder.x, (shoulder.y + FLOOR) / 2, shoulder.z)); // pedestal
part(new THREE.CylinderGeometry(0.7, 0.75, 0.08, 48), joint, V(shoulder.x, FLOOR + 0.04, shoulder.z));
part(new THREE.CylinderGeometry(0.27, 0.27, 0.34, 32), paint_, shoulder);
const hinge = new THREE.CylinderGeometry(1, 1, 1, 24).rotateZ(Math.PI / 2); // axis across the arm's plane
const links = [0, 1, 2].map(i => {
  const g = new THREE.Group();
  if (i < 2) {
    part(new THREE.CylinderGeometry(i ? 0.085 : 0.1, i ? 0.1 : 0.12, 1, 24).translate(0, 0.5, 0), paint_, V(), null, g).name = 'beam';
    part(hinge, joint, V(), V(0.36, i ? 0.15 : 0.18, i ? 0.15 : 0.18), g);
  } else {                                                    // the clipper: slim handle, head, and the blade at the very tip
    part(hinge, joint, V(), V(0.3, 0.11, 0.11), g);
    part(new THREE.CylinderGeometry(0.035, 0.05, 0.54, 16).translate(0, 0.27, 0), joint, V(), null, g);
    part(new THREE.BoxGeometry(0.26, 0.055, 0.075), std(0x2f6fed, 0.4, 0.2), V(0, 0.565, 0), null, g);
    part(new THREE.BoxGeometry(0.28, 0.008, 0.09), steel, V(0, 0.596, 0), null, g);
  }
  scene.add(g);
  return g;
});
const ax = V(), ay = V(), az = V(), side = V(1, 0, 0);
function poseArm() {
  a.set(tip.x - shoulder.x, 0, tip.z - shoulder.z);
  if (a.lengthSq() > 1e-6) side.set(a.z, 0, -a.x).normalize(); // across the plane the arm bends in
  links.forEach((g, i) => {
    ay.copy(armNow[i + 1]).sub(armNow[i]);
    const len = ay.length();
    ay.divideScalar(len);
    az.crossVectors(side, ay).normalize();
    ax.crossVectors(ay, az);
    g.quaternion.setFromRotationMatrix(m.makeBasis(ax, ay, az));
    g.position.copy(armNow[i]);
    const beam = g.getObjectByName('beam');
    if (beam) beam.scale.y = len;
  });
}

// ---------- the agent's camera: it only ever gets what this sees ----------
const EYE = 5.2, eyeGoal = V();
const agentCam = new THREE.PerspectiveCamera(36, 4 / 3, 0.1, 60);
const camBody = new THREE.Group();
part(new THREE.BoxGeometry(0.34, 0.22, 0.24), joint, V(), null, camBody);
part(new THREE.CylinderGeometry(0.075, 0.095, 0.18, 24).rotateX(Math.PI / 2), std(0x0d0f12, 0.15, 0.8), V(0, 0, 0.2), null, camBody);
part(ball, new THREE.MeshBasicMaterial({ color: 0xff3b30 }), V(0.12, 0.08, 0.125), V(0.016, 0.016, 0.016), camBody);
camBody.traverse(o => { o.castShadow = false; });
scene.add(camBody);
const camAt = c => V(Math.cos(c[1]) * Math.sin(c[0]), Math.sin(c[1]), Math.cos(c[1]) * Math.cos(c[0])).multiplyScalar(EYE);
agentCam.position.copy(camAt(R.frames[0].cam));
let agentView = false;

const nickMat = new THREE.MeshBasicMaterial({ color: 0xff2d2d }), nickMarks = new Map();

// ---------- showing a step ----------
const hud = document.getElementById('hud'), slider = document.getElementById('t'), button = document.getElementById('play'), pip = document.getElementById('pip');
let k = -1, playing = !LIVE, acc = 0, then = performance.now(), note = '', hairClock = 0;
const last = () => R.frames.length - 1;

function show(step) {
  const F = R.frames[step], falls = step === k + 1;      // only a single step forward drops clippings
  if (step < k) { clips.count = 0; clipNext = 0; }
  for (const s of strands) {
    let L = F.len[s.cell];
    if (L === uncut[s.cell]) L *= s.vary;                // uncut hair is a little ragged; a cut is exact
    setLength(s, L, falls, F);
  }
  k = step;
  if (tint) paint(F);
  R.frames.forEach((f, i) => {
    if (!f.nick) return;
    if (!nickMarks.has(i)) {
      const mark = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 8), nickMat);
      mark.position.copy(on(...f.arm[3]));
      scene.add(mark);
      nickMarks.set(i, mark);
    }
    nickMarks.get(i).visible = i <= k;
  });
  F.arm.forEach((p, i) => armGoal[i].set(...p));
  eyeGoal.copy(camAt(F.cam));
  slider.max = last();
  slider.value = k;
  hud.innerHTML = `step ${k}/${last()}   ${F.left} left   ${F.a}\n` +
    `camera reads gap ${F.gap === null ? '-- (blade hidden)' : F.gap.toFixed(3)}   ${F.cell === null ? 'over bare skin' : 'over cell ' + F.cell}   target ${R.target}\n` +
    `nicks ${F.nicks}   score ${F.score.toFixed(3)}${F.over ? '   episode over' : ''}\n` +
    (note ? `<b>${note}</b>\n` : '') + '<small>' +
    (LIVE ? 'arrows = slide blade along the scalp   W/S = lift / lower   click the head = go there   shift = fine\n' +
            '1-8 = turn joints one at a time   J/L I/K = aim the camera   space = cut   enter = done   N = new head\n'
          : 'space = play/pause   arrows = step\n') +
    'drag = orbit   V = see through the agent\'s camera   C = colour hair by score   T = show target length   red dot = nick</small>';
}

// ---------- replay controls ----------
function setPlaying(on) {
  if (on && k === last()) show(0);
  playing = on;
  acc = 0;
  if (!LIVE) button.textContent = on ? 'pause' : 'play';
}

// ---------- live controls: every key becomes environment actions ----------
let chain = Promise.resolve();
const queue = job => { chain = chain.then(job); };
const post = async (path, body) => (await fetch(path, { method: 'POST', body })).json();
async function act(action) {
  const res = await post('/step', action);
  note = res.error ?? '';
  if (!res.error) R.frames.push(res);
  show(last());
  return !res.error;
}
const here = () => V(...R.frames[last()].arm[3]);
async function reach(p) { // pendant-style jog: the server works out which joints to turn, then it is an ordinary move
  const res = await post('/reach', `${p.x} ${p.y} ${p.z}`);
  if (res.error) { note = res.error; show(last()); return false; }
  return act(res.action);
}
function slide(column, amount) { // along the scalp, in the camera's right (0) or up (1) direction
  const p = here(), r = p.length(), n = p.clone().normalize();
  const t = tangent(V().setFromMatrixColumn(camera.matrixWorld, column), n);
  return t.length() < 0.15 ? true : reach(p.addScaledVector(t.normalize(), amount).setLength(r));
}
function lift(amount) {
  const p = here();
  return reach(p.setLength(Math.max(0.05, p.length() + amount)));
}
async function goTo(target) { // round the head at the current height, as many moves as it takes
  for (let i = 0; i < 30; i++) {
    const p = here(), r = p.length(), n = p.clone().normalize(), angle = n.angleTo(target);
    if (angle < 0.015) return;
    const axis = V().crossVectors(n, target).normalize();
    if (!await reach(n.applyAxisAngle(axis, Math.min(angle, 0.3 / r)).multiplyScalar(r))) return;
  }
}
const turn = (j, amount) => act('move ' + [0, 1, 2, 3].map(i => i === j ? amount : 0).join(' '));
function aim(dAz, dEl) {
  const c = R.frames[last()].cam;
  return act(`look ${(c[0] + dAz).toFixed(3)} ${(c[1] + dEl).toFixed(3)}`);
}
async function newHead() {
  await post('/new', '');
  location.reload();
}

addEventListener('keydown', e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === 'c') { tint = !tint; paint(R.frames[k]); return; }
  if (key === 't' && shell) { shell.visible = !shell.visible; return; }
  if (key === 'v') { agentView = !agentView; pip.style.display = agentView ? 'none' : ''; return; }
  if (!LIVE) {
    if (key === ' ') { e.preventDefault(); setPlaying(!playing); }
    if (key === 'ArrowRight') { setPlaying(false); show(Math.min(k + 1, last())); }
    if (key === 'ArrowLeft') { setPlaying(false); show(Math.max(k - 1, 0)); }
    return;
  }
  const size = e.shiftKey ? 0.02 : 0.1, rise = e.shiftKey ? 0.01 : 0.05, bend = e.shiftKey ? 0.02 : 0.1;
  const digit = e.code.startsWith('Digit') ? +e.code[5] : 0; // 1/2 yaw, 3/4 shoulder, 5/6 elbow, 7/8 wrist
  const job = digit >= 1 && digit <= 8 ? () => turn((digit - 1) >> 1, digit % 2 ? -bend : bend) : {
    ArrowLeft: () => slide(0, -size), ArrowRight: () => slide(0, size), ArrowUp: () => slide(1, size), ArrowDown: () => slide(1, -size),
    w: () => lift(rise), s: () => lift(-rise), ' ': () => act('cut'), Enter: () => act('done'), n: newHead,
    j: () => aim(-0.3, 0), l: () => aim(0.3, 0), i: () => aim(0, 0.2), k: () => aim(0, -0.2),
  }[key];
  if (job) { e.preventDefault(); queue(job); }
});
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!LIVE || agentView || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; // a drag orbits
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
  const hit = ray.intersectObject(head)[0]?.point ?? ray.ray.intersectSphere(new THREE.Sphere(V(), 1.4), V()); // the hair counts too
  if (hit) queue(() => goTo(hit.normalize()));
});
// Blur after use, so space and the arrows are not also handled by the focused control.
button.textContent = LIVE ? 'new head' : 'pause';
button.onclick = () => { LIVE ? newHead() : setPlaying(!playing); button.blur(); };
slider.oninput = () => { setPlaying(false); show(+slider.value); };
slider.onchange = () => slider.blur();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

show(LIVE ? last() : 0);
paint(R.frames[k]);
armNow.forEach((p, i) => p.copy(armGoal[i]));
for (let i = 0; i < 120; i++) simulateHair(false); // let the hair fall into place before the first frame

function renderAgentView(x, y, w, h) { // what the agent's camera sees; its own body is not in the shot
  agentCam.aspect = w / h;
  agentCam.updateProjectionMatrix();
  camBody.visible = false;
  renderer.setViewport(x, y, w, h);
  renderer.setScissor(x, y, w, h);
  renderer.render(scene, agentCam);
  camBody.visible = true;
}
renderer.setScissorTest(true);
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - then) / 1000, 0.05), ease = 1 - Math.exp(-dt * 18);
  then = now;
  if (playing) {
    acc += dt * SPEED;
    if (acc >= 1) { acc -= 1; show(Math.min(k + 1, last())); }
    if (k === last()) setPlaying(false);
  }
  tipWas.copy(tip);
  armNow.forEach((p, i) => p.lerp(armGoal[i], ease));
  tipVel.copy(tip).sub(tipWas).divideScalar(Math.max(dt, 1e-3));
  poseArm();
  agentCam.position.lerp(eyeGoal, 1 - Math.exp(-dt * 6)).setLength(EYE); // glides round the head on its sphere
  agentCam.lookAt(0, 0, 0);
  camBody.position.copy(agentCam.position);
  camBody.lookAt(0, 0, 0);
  hairClock = Math.min(hairClock + dt, 3 * TICK);
  for (; hairClock >= TICK; hairClock -= TICK) simulateHair(hairClock < 2 * TICK);
  simulateClips(dt);
  controls.update();
  if (agentView) renderAgentView(0, 0, innerWidth, innerHeight);
  else {
    renderer.setViewport(0, 0, innerWidth, innerHeight);
    renderer.setScissor(0, 0, innerWidth, innerHeight);
    renderer.render(scene, camera);
    renderAgentView(innerWidth - 314, 50, 300, 225);
  }
});
</script>
</body>
</html>
